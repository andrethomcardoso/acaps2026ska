<html lang="pt-BR">
<head>
<meta charset="utf-8">

<style>
:root{
  --ink:#15241E; --canvas:#EEF2F0; --surface:#FFFFFF; --surface-2:#F7FAF8;
  --green:#009B4D; --green-dk:#00703A; --green-soft:#E2F3E9;
  --amber:#C9812A; --amber-soft:#FBF0DC;
  --clay:#A9543E; --clay-soft:#F7E6E1;
  --line:#D8E1DC; --muted:#61736B;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--canvas); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.5; font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green-dk)}

/* ---------- topo ---------- */
header{
  background:var(--ink); color:#EAF2EE;
  padding:18px 24px 0; position:sticky; top:0; z-index:40;
  box-shadow:0 1px 0 rgba(0,0,0,.12);
}
.brandrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;max-width:1400px;margin:0 auto}
.brandrow h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.01em}
.brandrow .sub{color:#8FA89D;font-size:13px}
.brandrow .spacer{flex:1}
.toolbtn{
  background:transparent;border:1px solid #3A4F45;color:#C8D9D1;
  padding:5px 11px;border-radius:7px;cursor:pointer;font-size:13px;
}
.toolbtn:hover{border-color:var(--green);color:#fff}
.sav{font-size:12px;color:#7FBF9B;display:flex;align-items:center;gap:6px;white-space:nowrap}
.sav::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
.sav.ruim{color:#F0B5A4;font-weight:600}
.sav.ruim::before{background:#E06B48}
#faixa{
  display:none;max-width:1400px;margin:14px auto 0;background:#4A2118;
  border:1px solid #7A3A28;color:#FFDCD2;border-radius:9px;
  padding:11px 15px;font-size:13px;line-height:1.45;
}
nav{display:flex;gap:2px;overflow-x:auto;max-width:1400px;margin:14px auto 0;scrollbar-width:thin}
nav button{
  background:transparent;border:0;border-bottom:3px solid transparent;
  color:#93AAA0;padding:10px 16px 11px;cursor:pointer;white-space:nowrap;
  font-size:14px;border-radius:6px 6px 0 0;
}
nav button:hover{color:#E7F2EC;background:rgba(255,255,255,.05)}
nav button[aria-selected="true"]{color:#fff;border-bottom-color:var(--green);font-weight:600}
nav .cnt{color:#6F877C;font-size:12px;margin-left:6px}
nav button[aria-selected="true"] .cnt{color:#7FCBA0}

main{max-width:1400px;margin:0 auto;padding:22px 24px 80px}
.panel{display:none}
.panel.on{display:block}

h2{font-size:17px;margin:0 0 3px;font-weight:650;letter-spacing:-.01em}
.lede{color:var(--muted);font-size:13.5px;margin:0 0 18px}
section{margin-bottom:26px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}

/* ---------- medidor de cobertura ---------- */
.cover{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px}
.cover .big{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.cover .pct{font-size:56px;line-height:.9;font-weight:700;letter-spacing:-.03em}
.cover .pctlab{color:var(--muted);font-size:13.5px;padding-bottom:6px}
.track{height:22px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;margin-top:16px}
.track i{display:block;height:100%;transition:width .35s ease}
.track i.g{background:var(--green)}
.track i.m{background:var(--amber)}
.track i.p{background:var(--clay)}
.legend{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block}
.dot.g{background:var(--green)} .dot.m{background:var(--amber)} .dot.p{background:var(--clay)}

/* ---------- kpis ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi b{display:block;font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.kpi small{color:var(--muted);font-size:12.5px}

/* ---------- gráficos de barra ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
.chart h3{font-size:14px;margin:0 0 2px;font-weight:600}
.chart .hint{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.brow{display:grid;grid-template-columns:118px 1fr 62px;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
.brow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:15px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);transition:width .3s ease}
.bar i.amber{background:var(--amber)} .bar i.clay{background:var(--clay)} .bar i.ink{background:#4A6B5C}
.brow .vl{text-align:right;color:var(--muted);font-size:12.5px}
.empty{color:var(--muted);font-size:13px;padding:14px 0;font-style:italic}

/* ---------- filtros ---------- */
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters input[type=search],.filters select{
  border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:13.5px;
}
.filters input[type=search]{min-width:210px}
.filters .res{color:var(--muted);font-size:13px;margin-left:auto}

/* ---------- tabelas ---------- */
.tw{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{
  text-align:left;font-weight:600;font-size:12px;color:var(--muted);
  padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);
  position:sticky;top:0;white-space:nowrap;
}
td{padding:9px 12px;border-bottom:1px solid #EDF2EF;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.clic{cursor:pointer}
tbody tr.clic:hover{background:var(--green-soft)}
.nmcell{font-weight:600}
td.num{text-align:right;color:var(--muted)}

.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.tag.g{background:var(--green-soft);color:var(--green-dk)}
.tag.m{background:var(--amber-soft);color:#8A5A12}
.tag.p{background:var(--clay-soft);color:#8A3D29}
.tag.ok{background:var(--green);color:#fff}
.tag.no{background:#E9EEEB;color:var(--muted)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{background:var(--green-soft);color:var(--green-dk);border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:600}
.chip b{cursor:pointer;margin-left:5px;opacity:.55;font-weight:700}
.chip b:hover{opacity:1;color:var(--clay)}

/* ---------- modal ---------- */
.veil{position:fixed;inset:0;background:rgba(14,28,22,.5);display:none;z-index:60;padding:20px;overflow:auto}
.veil.on{display:block}
.modal{background:var(--surface);max-width:720px;margin:36px auto;border-radius:14px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mhead{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.mhead h3{margin:0 0 5px;font-size:19px;letter-spacing:-.01em}
.mhead .meta{color:var(--muted);font-size:13px}
.mhead .x{margin-left:auto;background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);padding:0 2px}
.mhead .x:hover{color:var(--ink)}
.mbody{padding:20px 24px 24px}
.mbody h4{font-size:13px;margin:0 0 8px;font-weight:600}
.mbody section{margin-bottom:22px}
textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:84px;resize:vertical;font-size:14px}
.btn{background:var(--green);color:#fff;border:0;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:14px;font-weight:600}
.btn:hover{background:var(--green-dk)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 12px;font-size:13px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
select.sol{border:1px solid var(--line);border-radius:8px;padding:8px 10px;flex:1;min-width:200px;background:var(--surface)}
.fu{border-left:3px solid var(--green);background:var(--surface-2);padding:10px 13px;border-radius:0 8px 8px 0;margin-bottom:9px}
.fu time{display:block;color:var(--muted);font-size:11.5px;margin-bottom:4px}
.fu p{margin:0;white-space:pre-wrap;font-size:13.5px}
.fu .del{float:right;background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px}
.fu .del:hover{color:var(--clay)}
.switch{display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px 13px;cursor:pointer}
.switch input{width:17px;height:17px;accent-color:var(--green);cursor:pointer}

/* ---------- cadastro ---------- */
.tw.edit td{padding:5px 7px}
.tw.edit input,.tw.edit select{
  width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 7px;font-size:13.5px;
}
.tw.edit input:hover,.tw.edit select:hover{border-color:var(--line)}
.tw.edit input:focus,.tw.edit select:focus{border-color:var(--green);background:var(--surface);outline:none}
.del-row{background:none;border:0;color:#B9C6BF;cursor:pointer;font-size:17px;padding:0 5px}
.del-row:hover{color:var(--clay)}
.note{background:var(--amber-soft);border:1px solid #EBD6AC;border-radius:var(--r);padding:12px 15px;font-size:13px;color:#6B4A12;margin-bottom:18px}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);
  background:var(--ink);color:#fff;padding:10px 20px;border-radius:9px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.22s;z-index:90;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:640px){
  main{padding:18px 14px 70px} header{padding:16px 14px 0}
  .cover .pct{font-size:44px} .brow{grid-template-columns:90px 1fr 48px}
  .modal{margin:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
</style>
</head>

let aviso = "";          // falha de gravação (some quando volta a salvar)
let avisoCarga = "";     // problema detectado na leitura inicial (permanece)
let ultimoSalvo = null;
let abertoId = null;     // empresa aberta no detalhe

function baseInicial(){
  return SEED.trim().split("\n").map((l,i)=>{
    const [nome,seg,porte,fat,site,exe] = l.split("|");
    return {id:"e"+i, nome, seg, porte, fat, site, exec:exe,
            visitado:false, followups:[], solucoes:[]};
  });
}

let state = carregar();

function carregar(){
  armazenaOk = testarArmazenamento();
  if(!armazenaOk){
    avisoCarga = "Este navegador não está guardando os registros. Tudo o que for lançado some ao fechar ou recarregar a página. "
          + (window.self !== window.top
              ? "Abra o endereço publicado direto no navegador, fora da pré-visualização."
              : "Saia da navegação anônima e libere os dados de site nas configurações.");
    return {empresas: baseInicial()};
  }
  for(const k of [KEY, KEY_BAK]){
    let raw = null;
    try{ raw = localStorage.getItem(k); }catch(e){}
    if(!raw) continue;
    try{
      const d = JSON.parse(raw);
      if(d && Array.isArray(d.empresas) && d.empresas.length){
        if(k === KEY_BAK) avisoCarga = "O registro principal deste aparelho estava ilegível. Recuperei a cópia de segurança anterior — confira se os últimos lançamentos estão aqui antes de continuar.";
        return d;
      }
    }catch(e){
      /* Nunca sobrescrever um registro ilegível: preserva o conteúdo bruto
         para recuperação manual e tenta a cópia de segurança. */
      try{ localStorage.setItem(KEY + ".ilegivel", raw); }catch(_){}
      avisoCarga = "Não consegui ler o registro anterior deste aparelho. Ele foi preservado, não apagado. Avise antes de lançar coisas novas.";
    }
  }
  return {empresas: baseInicial()};
}

/* Confirma que dá para gravar E reler de volta. Alguns navegadores aceitam
   a gravação e descartam o conteúdo depois (modo privativo do Safari). */
function testarArmazenamento(){
  try{
    const t = "__teste" + Date.now();
    localStorage.setItem(t, "1");
    const v = localStorage.getItem(t);
    localStorage.removeItem(t);
    return v === "1";
  }catch(e){ return false; }
}

function salvar(){
  if(!armazenaOk){ pintarStatus(); return; }
  const novo = JSON.stringify(state);
  try{
    const atual = localStorage.getItem(KEY);
    /* Roda a cópia de segurança só se o conteúdo atual for válido, para não
       substituir um bom backup por conteúdo corrompido. */
    if(atual && atual !== novo){
      try{
        const p = JSON.parse(atual);
        if(p && Array.isArray(p.empresas) && p.empresas.length) localStorage.setItem(KEY_BAK, atual);
      }catch(_){}
    }
    localStorage.setItem(KEY, novo);
    if(localStorage.getItem(KEY) !== novo) throw new Error("gravação não persistiu");
    ultimoSalvo = new Date();
    aviso = "";
  }catch(e){
    armazenaOk = false;
    aviso = "O navegador parou de guardar os registros (memória cheia ou armazenamento bloqueado). Use o botão Baixar dados agora, antes de fechar a página.";
  }
  pintarStatus();
}

function pintarStatus(){
  const fx = document.getElementById("faixa");
  const st = document.getElementById("statusSalvo");
  if(st){
    st.textContent = armazenaOk
      ? (ultimoSalvo ? "salvo " + ultimoSalvo.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}) : "pronto")
      : "não está salvando";
    st.className = armazenaOk ? "sav" : "sav ruim";
  }
  const msg = [aviso, avisoCarga].filter(Boolean).join(" ");
  if(fx){
    fx.textContent = msg;
    fx.style.display = msg ? "block" : "none";
  }
}

function novoId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function carimbo(ts){

         d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});

function cab(extra){
  return Object.assign({
    "apikey": SUPA_KEY,
    "Authorization": "Bearer " + SUPA_KEY,
    "Content-Type": "application/json"
  }, extra || {});
}
function paraBanco(e){
  return {id:e.id, ts:e.ts, exec:e.exec||"", empresa_id:e.empresaId||"", empresa:e.empresa||"",
          porte:e.porte||"", tipo:e.tipo||"", valor:e.valor==null?"":String(e.valor), quando:e.quando||""};
}
function doBanco(r){
  return {id:r.id, ts:Number(r.ts), exec:r.exec||"", empresaId:r.empresa_id||"", empresa:r.empresa||"",
          porte:r.porte||"", tipo:r.tipo||"", valor:r.valor==null?"":String(r.valor), quando:r.quando||""};
}

/* Toda alteração vira uma linha nova. A tabela não aceita alteração nem
   exclusão, então ninguém consegue apagar o registro de outra pessoa. */
function registrar(tipo, emp, valor, extra){
  if(!ligado()) return;
  fila.push(Object.assign({
    id: novoId(), ts: Date.now(),
    exec: emp ? emp.exec : "", empresaId: emp ? emp.id : "",
    empresa: emp ? emp.nome : "", porte: emp ? emp.porte : "",
    tipo, valor: valor == null ? "" : String(valor)
  }, extra || {}));
  salvarFila(); pintarSync(); enviar();
}

function enviar(){
  if(!ligado() || enviando || !fila.length) return;
  if(typeof navigator !== "undefined" && navigator.onLine === false){
    syncEstado = "offline"; pintarSync(); return;
  }
  enviando = true; syncEstado = "enviando"; pintarSync();
  const lote = fila.slice(0, 50);

  fetch(SUPA_URL + "/rest/v1/" + TABELA + "?on_conflict=id", {
    method: "POST",
    headers: cab({"Prefer": "resolution=ignore-duplicates,return=minimal"}),
    body: JSON.stringify(lote.map(paraBanco))
  }).then(r=>{
    if(!r.ok) return r.text().then(t=>{ throw new Error(r.status + " " + String(t).slice(0,180)); });
    const ids = new Set(lote.map(e=>e.id));
    fila = fila.filter(e=>!ids.has(e.id));
    salvarFila();
    lote.forEach(e=>{ if(!idsVistos.has(e.id)){ idsVistos.add(e.id); eventos.push(e); if(e.ts > ultimoTs) ultimoTs = e.ts; } });
    syncEstado = fila.length ? "pendente" : "ok"; erroSync = "";
  }).catch(err=>{
    syncEstado = "erro"; erroSync = String(err && err.message || err);
  }).then(()=>{
    enviando = false; pintarSync();
    if(fila.length) setTimeout(enviar, syncEstado === "erro" ? 8000 : 300);
  });
}

/* Busca o que entrou desde a última consulta. É o que mantém os cinco
   aparelhos olhando para a mesma informação. */
function puxar(){
  if(!ligado() || puxando) return Promise.resolve(0);
  puxando = true;
  const q = SUPA_URL + "/rest/v1/" + TABELA + "?select=*&order=ts.asc&limit=1000"
          + (ultimoTs ? "&ts=gte." + ultimoTs : "");
  return fetch(q, {headers: cab()})
    .then(r=>{
      if(!r.ok) return r.text().then(t=>{ throw new Error(r.status + " " + String(t).slice(0,180)); });
      return r.json();
    })
    .then(linhas=>{
      let novos = 0;
      (linhas || []).forEach(l=>{
        const e = doBanco(l);
        if(!idsVistos.has(e.id)){ idsVistos.add(e.id); eventos.push(e); novos++; }
        if(e.ts > ultimoTs) ultimoTs = e.ts;
      });
      if(novos) aplicar();
      syncEstado = fila.length ? "pendente" : "ok";
      erroSync = "";
      /* Página cheia: provavelmente há mais para trazer. */
      if((linhas || []).length >= 1000) setTimeout(puxar, 200);
      return novos;
    })
    .catch(err=>{ syncEstado = "erro"; erroSync = String(err && err.message || err); return 0; })
    .then(n=>{ puxando = false; pintarSync(); return n; });
}

/* Reconstrói a tela a partir do log. Se a pessoa estiver digitando ou com
   uma empresa aberta, espera — ninguém perde o que está escrevendo. */
function aplicar(){
  const a = typeof document !== "undefined" ? document.activeElement : null;
  const ocupado = abertoId || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
  if(ocupado){ pendenteRender = true; return; }
  pendenteRender = false;
  state = projetar(eventos.concat(fila));
  salvar(); renderNav(); renderMain();
}

/* Empurrão do servidor: chega em menos de um segundo, sem esperar a
   próxima consulta. Se a biblioteca não carregar, a consulta periódica
   continua dando conta sozinha. */
function ligarTempoReal(){
  if(!ligado() || canal) return;
  const lib = typeof window !== "undefined" ? window.supabase : null;
  if(!lib || !lib.createClient) return;
  try{
    const cli = lib.createClient(SUPA_URL, SUPA_KEY);
    canal = cli.channel("acaps2026")
      .on("postgres_changes", {event:"INSERT", schema:"public", table:TABELA}, msg=>{
        const e = doBanco(msg.new || {});
        if(!e.id || idsVistos.has(e.id)) return;
        idsVistos.add(e.id); eventos.push(e);
        if(e.ts > ultimoTs) ultimoTs = e.ts;
        aplicar();
      })
      .subscribe(st=>{ tempoReal = (st === "SUBSCRIBED"); pintarSync(); });
  }catch(e){ canal = null; tempoReal = false; }
}

function reiniciarSync(){
  eventos = []; idsVistos = new Set(); ultimoTs = 0;
  canal = null; tempoReal = false;
  enviarHistorico();
  ligarTempoReal();
  return puxar();
}

/* Recarrega o log inteiro do zero. */
function consolidar(silencioso){
  if(!ligado()) return Promise.resolve();
  eventos = []; idsVistos = new Set(); ultimoTs = 0;
  return puxar().then(n=>{ if(!silencioso) toast(eventos.length + " interações carregadas"); });
}

function projetar(lista){
  const emp = baseInicial();
  const porId = {}; emp.forEach(e=>porId[e.id] = e);
  lista.slice().sort((a,b)=>a.ts - b.ts).forEach(ev=>{
    if(ev.tipo === "empresa+"){
      if(!porId[ev.empresaId]){
        let n; try{ n = JSON.parse(ev.valor); }catch(_){ return; }
        n.followups = []; n.solucoes = []; n.visitado = false;
        emp.push(n); porId[n.id] = n;
      }
      return;
    }
    const e = porId[ev.empresaId]; if(!e) return;
    switch(ev.tipo){
      case "visita":    e.visitado = ev.valor === "1"; break;
      case "followup":
        if(!e.followups.some(f=>String(f.ts) === String(ev.ts)))
          e.followups.push({ts:ev.ts, quando: ev.quando || carimbo(ev.ts), txt: ev.valor});
        e.visitado = true; break;
      case "followup-": e.followups = e.followups.filter(f=>String(f.ts) !== ev.valor); break;
      case "solucao+":  if(!e.solucoes.includes(ev.valor)) e.solucoes.push(ev.valor); break;
      case "solucao-":  e.solucoes = e.solucoes.filter(s=>s !== ev.valor); break;
      case "campo":     { let c; try{ c = JSON.parse(ev.valor); }catch(_){ break; } e[c.c] = c.v; break; }
      case "empresa-":  { const i = emp.indexOf(e); if(i>=0) emp.splice(i,1); delete porId[ev.empresaId]; break; }
    }
  });
  return {empresas: emp};
}

/* Sobe o que já estava lançado no aparelho antes de a sincronização
   existir. Identificadores derivados do conteúdo: repetir não duplica. */
function idFixo(){
  return Array.prototype.join.call(arguments, "~").replace(/\s+/g, "_").slice(0, 120);
}
function enviarHistorico(){
  if(!ligado()) return 0;
  const naFila = new Set(fila.map(e=>e.id));
  const agora = Date.now();
  let novos = 0;
  const por = (e, id, ts, tipo, valor, extra)=>{
    if(naFila.has(id) || idsVistos.has(id)) return;
    naFila.add(id); novos++;
    fila.push(Object.assign({
      id, ts, exec:e.exec, empresaId:e.id, empresa:e.nome, porte:e.porte,
      tipo, valor: String(valor)
    }, extra || {}));
  };
  state.empresas.forEach(e=>{
    (e.followups || []).forEach(f=>
      por(e, idFixo(e.id,"fu",f.ts), f.ts, "followup", f.txt, {quando:f.quando}));
    (e.solucoes || []).forEach(s=>
      por(e, idFixo(e.id,"sol",s), agora, "solucao+", s));
    if(e.visitado) por(e, idFixo(e.id,"vis","inicial"), agora, "visita", "1");
  });
  if(novos){ salvarFila(); pintarSync(); enviar(); }
  return novos;
}

/* Diagnóstico: traduz a falha em algo acionável. */
function diagnosticar(url, key){
  url = (url || "").trim().replace(/\/+$/, "");
  key = (key || "").trim();
  if(!url || !key) return Promise.resolve({ok:false, msg:"Preencha o endereço do projeto e a chave."});
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)$/i.test(url))
    return Promise.resolve({ok:false, msg:"O endereço do projeto é só o Project URL, no formato https://xxxxxxxx.supabase.co — sem barra no fim e sem /rest/v1."});
  if(/^sb_secret_/.test(key) || /service_role/.test(key))
    return Promise.resolve({ok:false, msg:"Essa é a chave secreta (service_role). Ela dá acesso total ao banco e NÃO pode ficar numa página publicada. Use a chave anon (publishable)."});
  if(!/^(eyJ|sb_publishable_)/.test(key))
    return Promise.resolve({ok:false, msg:"Isso não parece uma chave de API do Supabase. Em Project Settings → API, copie a chave anon / publishable inteira."});

  return fetch(url + "/rest/v1/" + TABELA + "?select=id&limit=1", {
    headers: {"apikey":key, "Authorization":"Bearer "+key, "Prefer":"count=exact"}
  }).then(r=>{
    if(r.ok){
      const cr = r.headers && r.headers.get ? r.headers.get("content-range") : null;
      const tot = cr && cr.indexOf("/") > -1 ? cr.split("/")[1] : "?";
      return {ok:true, msg:"Conexão funcionando. A tabela já tem " + tot + " interação(ões) registrada(s)."};
    }
    if(r.status === 401 || r.status === 403)
      return {ok:false, msg:"Chave recusada ou permissões ausentes. Confirme que copiou a chave anon inteira e que rodou o supabase.sql, que cria as políticas de leitura e gravação."};
    if(r.status === 404)
      return {ok:false, msg:"A tabela " + TABELA + " não existe neste projeto. Abra o SQL Editor do Supabase e rode o conteúdo do supabase.sql."};
    return r.text().then(t=>({ok:false, msg:"O servidor respondeu " + r.status + ": " + String(t).slice(0,180)}));
  }).catch(()=>({ok:false, msg:"Não consegui falar com o projeto. Confira o endereço e se o projeto não está pausado por inatividade no painel do Supabase."}));
}

/* Une um arquivo baixado ao que já existe, sem apagar nada.
   Continua útil como reserva caso a rede do pavilhão caia de vez. */
function mesclar(entrada){
  let novosFu = 0, novasSol = 0, novasEmp = 0, novasVis = 0;
  const porId = {}, porNome = {};
  state.empresas.forEach(e=>{ porId[e.id] = e; porNome[(e.nome||"").toUpperCase()] = e; });

  (entrada.empresas || []).forEach(v=>{
    let e = porId[v.id] || porNome[(v.nome||"").toUpperCase()];
    if(!e){
      e = Object.assign({}, v, {followups:[], solucoes:[], visitado:false});
      state.empresas.push(e); porId[e.id] = e; porNome[(e.nome||"").toUpperCase()] = e;
      novasEmp++;
    }
    if(v.visitado && !e.visitado){ e.visitado = true; novasVis++; }
    (v.followups || []).forEach(f=>{
      if(!e.followups.some(x=>String(x.ts) === String(f.ts) || x.txt === f.txt)){
        e.followups.push(f); novosFu++;
      }
    });
    e.followups.sort((a,b)=>a.ts - b.ts);
    (v.solucoes || []).forEach(s=>{
      if(!e.solucoes.includes(s)){ e.solucoes.push(s); novasSol++; }
    });
  });
  return {novosFu, novasSol, novasEmp, novasVis};
}

function pintarSync(){
  const el = document.getElementById("statusSync"); if(!el) return;
  el.style.display = ligado() ? "flex" : "none";
  if(!ligado()){ el.textContent = ""; return; }
  if(puxando && !eventos.length){ el.textContent = "carregando…"; el.className = "sav"; return; }
  const txt = {
    ok: tempoReal ? "tempo real" : "sincronizado",
    enviando: "enviando…",
    pendente: fila.length + " pendente" + (fila.length > 1 ? "s" : ""),
    offline: "sem conexão",
    erro: "falha ao sincronizar"
  };
  el.textContent = txt[syncEstado] || "";
  el.title = erroSync || "";
  el.className = "sav" + (["offline","erro","pendente"].includes(syncEstado) ? " ruim" : "");
}

window.addEventListener("storage", ev=>{
  if(ev.key !== KEY || !ev.newValue || abertoId) return;
  try{
    const d = JSON.parse(ev.newValue);
    if(d && Array.isArray(d.empresas) && d.empresas.length){
      state = d; renderNav(); renderMain();

});

/* ============================================================
   HELPERS
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const byId = id => state.empresas.find(e=>e.id===id);

function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2100);
}
function porteTag(p){ return `<span class="tag ${p.toLowerCase()}">${PORTES[p]||p}</span>`; }
function statusTag(v){ return v?`<span class="tag ok">Visitado</span>`:`<span class="tag no">Pendente</span>`; }

function barras(itens, cor){
  if(!itens.length) return `<p class="empty">Nada registrado ainda.</p>`;
  const max = Math.max(...itens.map(i=>i.v), 1);
  return itens.map(i=>`
    <div class="brow">
      <span class="nm" title="${esc(i.n)}">${esc(i.n)}</span>
      <span class="bar"><i class="${cor||''}" style="width:${i.v/max*100}%"></i></span>
      <span class="vl">${i.t!==undefined?esc(i.t):i.v}</span>
    </div>`).join("");
}

/* contagem de oportunidades por solução */
function oportPorSolucao(lista){
  const m = {};
  SOLUCOES.forEach(s=>m[s]=0);
  lista.forEach(e=>e.solucoes.forEach(s=>{ if(m[s]!==undefined) m[s]++; }));
  return SOLUCOES.map(s=>({n:s,v:m[s]})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
}

function filtrar(f, lista){
  const q=f.q.trim().toLowerCase();
  return lista.filter(e=>
    (!q || e.nome.toLowerCase().includes(q) || e.seg.toLowerCase().includes(q)) &&
    (!f.porte || e.porte===f.porte) &&
    (!f.exec || e.exec===f.exec) &&
    (!f.status || (f.status==="v" ? e.visitado : !e.visitado))
  );
}

function filtrosHTML(f, comExec){
  return `<div class="filters" data-f="${comExec?'g':'x'}">

function ligarCadastro(){
  const tb = $("#tbCad"); if(!tb) return;
  tb.addEventListener("input", ev=>{
    const f = ev.target.closest("[data-c]"); if(!f) return;
    const emp = byId(ev.target.closest("tr").dataset.id); if(!emp) return;
    emp[f.dataset.c] = f.value;
    salvar(); renderNav();
  });
  tb.addEventListener("change", ev=>{
    const f = ev.target.closest("[data-c]"); if(!f) return;
    const emp = byId(ev.target.closest("tr").dataset.id); if(!emp) return;
    emp[f.dataset.c] = f.value;
    registrar("campo", emp, JSON.stringify({c:f.dataset.c, v:f.value}));
    salvar(); renderNav();
    if(f.dataset.c==="porte"||f.dataset.c==="exec") toast("Alteração aplicada em todas as abas");
  });
  tb.addEventListener("click", ev=>{
    const b = ev.target.closest("[data-del]"); if(!b) return;
    const emp = byId(b.dataset.del);
    if(confirm(`Excluir ${emp.nome}? Os follow-ups registrados para esta empresa serão perdidos.`)){
      registrar("empresa-", emp, "");
      state.empresas = state.empresas.filter(x=>x.id!==emp.id);
      render(); toast("Empresa excluída");
    }
  });
  $("#addEmp").onclick = ()=>{
    const nova = {
      id:"n"+Date.now(), nome:"Nova empresa", seg:SEGMENTOS[0], porte:"M",
      fat:"A definir", site:"", exec:EXECS[0], visitado:false, followups:[], solucoes:[]
    };
    state.empresas.push(nova);
    registrar("empresa+", nova, JSON.stringify(nova));
    render();
    const tr = $("#tbCad").lastElementChild;
    tr.scrollIntoView({block:"center"}); tr.querySelector("input").select();
  };
}

          <select class="sol" id="selSol">
            <option value="">Escolha uma solução</option>
            ${SOLUCOES.filter(s=>!e.solucoes.includes(s)).map(s=>`<option>${esc(s)}</option>`).join("")}
          </select>
          <button class="btn" id="addSol">Adicionar</button>
        </div>
      </section>`}

      <section>
        <h4>Soluções registradas ${e.solucoes.length?`(${e.solucoes.length})`:""}</h4>
        ${e.solucoes.length
          ? `<div class="chips">${e.solucoes.map(s=>
              `<span class="chip">${esc(s)}${gestor?"":`<b data-rm="${esc(s)}" title="Remover">&times;</b>`}</span>`).join("")}</div>`
          : `<p class="empty">Nenhuma oportunidade apontada ainda.</p>`}
      </section>

      <section>
        <h4>Histórico de follow-ups ${e.followups.length?`(${e.followups.length})`:""}</h4>
        ${e.followups.length
          ? e.followups.slice().reverse().map(f=>`
              <div class="fu">
                ${gestor?"":`<button class="del" data-fu="${f.ts}">excluir</button>`}
                <time>${esc(f.quando)}</time><p>${esc(f.txt)}</p>
              </div>`).join("")
          : `<p class="empty">Sem registros. ${gestor?"O executivo ainda não lançou follow-up nesta conta.":"Escreva o primeiro acima."}</p>`}
      </section>

      <div class="row" style="justify-content:flex-end">
        <button class="btn ghost" id="fechar2">Fechar</button>
      </div>
    </div>`;

  $("#veil").classList.add("on");
  document.body.style.overflow="hidden";
  ligarModal(e, gestor);
}

function fechar(){
  $("#veil").classList.remove("on");
  document.body.style.overflow="";
  abertoId = null;
  if(pendenteRender) aplicar();
}

function ligarModal(e, gestor){
  $("#fechar").onclick = fechar;
  $("#fechar2").onclick = fechar;
  if(gestor) return;

  $("#chkVis").onchange = ev=>{
    e.visitado = ev.target.checked;
    registrar("visita", e, e.visitado ? "1" : "0");
    salvar(); renderMainMantendoModal();
    toast(e.visitado?"Visita registrada":"Visita desmarcada");
  };

  $("#addFu").onclick = ()=>{
    const t = $("#txtFu").value.trim();
    if(!t){ $("#txtFu").focus(); toast("Escreva o follow-up antes de salvar"); return; }
    const ts = Date.now();
    const f = {ts, quando: carimbo(ts), txt: t};
    e.followups.push(f);
    if(!e.visitado) e.visitado = true;
    registrar("followup", e, t, {ts, quando: f.quando});
    salvar(); renderMainMantendoModal(); toast("Follow-up salvo");
  };

  $("#addSol").onclick = ()=>{
    const s = $("#selSol").value;
    if(!s){ toast("Escolha uma solução na lista"); return; }
    if(!e.solucoes.includes(s)){ e.solucoes.push(s); registrar("solucao+", e, s); }
    salvar(); renderMainMantendoModal(); toast(s+" adicionada");
  };
}

/* delegação registrada uma única vez: o #modal é reaproveitado a cada abertura */
$("#modal").addEventListener("click", ev=>{
  const e = byId(abertoId); if(!e || aba==="gestao") return;
  const rm = ev.target.closest("[data-rm]");
  if(rm){
    e.solucoes = e.solucoes.filter(s=>s!==rm.dataset.rm);
    registrar("solucao-", e, rm.dataset.rm);
    salvar(); renderMainMantendoModal(); return;
  }
  const df = ev.target.closest("[data-fu]");
  if(df){
    e.followups = e.followups.filter(f=>String(f.ts)!==df.dataset.fu);
    registrar("followup-", e, df.dataset.fu);
    salvar(); renderMainMantendoModal(); toast("Follow-up excluído");
  }
});

function renderMainMantendoModal(){
  const id = abertoId;
  renderNav(); renderMain();
  if(id) abrir(id);
}

/* ============================================================
   LIGAÇÕES GERAIS
   ============================================================ */
function ligarTabelas(){
  document.querySelectorAll("#tbGestao, #tbExec").forEach(tb=>{
    tb.onclick = ev=>{
      const tr = ev.target.closest("tr[data-id]");
      if(tr) abrir(tr.dataset.id);
    };
  });
}

function contarResultados(){
  const r = $("#res"); if(!r) return;
  if(aba==="gestao"){
    r.textContent = `${filtrar(fG,state.empresas).length} de ${state.empresas.length}`;
  } else if(aba.startsWith("ex:")){
    const nome = aba.slice(3);
    const meus = state.empresas.filter(e=>e.exec===nome);
    r.textContent = `${filtrar(fE[nome],meus).length} de ${meus.length}`;
  }
}

function ligarFiltros(){
  const box = document.querySelector(".filters"); if(!box) return;
  contarResultados();
  const alvo = aba==="gestao" ? fG : fE[aba.slice(3)];
  box.querySelectorAll("[data-k]").forEach(el=>{
    const ev = el.tagName==="SELECT" ? "change" : "input";
    el.addEventListener(ev, ()=>{
      alvo[el.dataset.k] = el.value;
      if(aba==="gestao") $("#tbGestao").innerHTML = linhasGestao();
      else $("#tbExec").innerHTML = linhasExec(aba.slice(3));
      ligarTabelas();
    });
  });
}

$("#veil").addEventListener("click", ev=>{ if(ev.target.id==="veil") fechar(); });
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape" && abertoId) fechar(); });

$("#btnExport").onclick = ()=>{
  const b = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = "acaps-2026-prospeccao.json";
  a.click(); URL.revokeObjectURL(a.href);
  toast("Arquivo baixado");
};
$("#btnImport").onclick = ()=>$("#fileIn").click();
$("#fileIn").onchange = ev=>{
  const arquivos = [...ev.target.files]; if(!arquivos.length) return;
  Promise.all(arquivos.map(f=>new Promise(res=>{
    const r = new FileReader();
    r.onload = ()=>{ try{ res(JSON.parse(r.result)); }catch(_){ res(null); } };
    r.onerror = ()=>res(null);
    r.readAsText(f);
  }))).then(lidos=>{
    let fu=0, sol=0, emp=0, vis=0, bons=0, ruins=0;
    lidos.forEach(d=>{
      if(!d || !Array.isArray(d.empresas) || !d.empresas.length){ ruins++; return; }
      const r = mesclar(d);
      fu+=r.novosFu; sol+=r.novasSol; emp+=r.novasEmp; vis+=r.novasVis; bons++;
    });
    ev.target.value = "";
    if(!bons){ toast("Nenhum arquivo válido. Use os JSON baixados por esta página."); return; }
    render();
    toast(`${bons} arquivo(s) unidos: ${fu} follow-up(s), ${sol} oportunidade(s), ${vis} visita(s)`
          + (emp ? `, ${emp} empresa(s) nova(s)` : "")
          + (ruins ? ` · ${ruins} ignorado(s)` : ""));
  });
};
carregarFila();
render();
pintarSync();

/* Primeira vez que este aparelho abre a página já sincronizada: sobe
   sozinho o que foi lançado antes, para nada ficar preso no celular. */
if(ligado()){
  let jaSubiu = false;
  try{ jaSubiu = localStorage.getItem(KEY + ".hist") === "1"; }catch(e){}
  if(!jaSubiu){
    const n = enviarHistorico();
    try{ localStorage.setItem(KEY + ".hist", "1"); }catch(e){}
    if(n) setTimeout(()=>toast(n + " lançamento(s) anteriores enviados ao servidor"), 900);
  }
}

if(ligado()){
  ligarTempoReal();
  puxar();
}
enviar();
setInterval(enviar, 15000);
/* Consulta de reforço: mantém todo mundo alinhado mesmo se o canal de
   tempo real cair, o que acontece com facilidade no wi-fi de pavilhão. */
setInterval(()=>{ if(ligado()) puxar(); }, tempoReal ? 15000 : 5000);
/* Se a pessoa estava digitando quando chegou novidade, aplica ao terminar. */
setInterval(()=>{ if(pendenteRender) aplicar(); }, 2000);
window.addEventListener("online", enviar);
window.addEventListener("offline", ()=>{ if(ligado()){ syncEstado="offline"; pintarSync(); } });
window.addEventListener("beforeunload", ev=>{
  if(fila.length){ ev.preventDefault(); ev.returnValue = ""; }
});
</script>
</body>
</html>

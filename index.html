<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prospecção ACAPS Trade Show 2026 · Sankhya</title>
<style>
:root{
  --ink:#15241E; --canvas:#EEF2F0; --surface:#FFFFFF; --surface-2:#F7FAF8;
  --green:#009B4D; --green-dk:#00703A; --green-soft:#E2F3E9;
  --amber:#C9812A; --amber-soft:#FBF0DC;
  --clay:#A9543E; --clay-soft:#F7E6E1;
  --line:#D8E1DC; --muted:#61736B;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--canvas); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.5; font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green-dk)}

/* ---------- topo ---------- */
header{
  background:var(--ink); color:#EAF2EE;
  padding:18px 24px 0; position:sticky; top:0; z-index:40;
  box-shadow:0 1px 0 rgba(0,0,0,.12);
}
.brandrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;max-width:1400px;margin:0 auto}
.brandrow h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.01em}
.brandrow .sub{color:#8FA89D;font-size:13px}
.brandrow .spacer{flex:1}
.toolbtn{
  background:transparent;border:1px solid #3A4F45;color:#C8D9D1;
  padding:5px 11px;border-radius:7px;cursor:pointer;font-size:13px;
}
.toolbtn:hover{border-color:var(--green);color:#fff}
nav{display:flex;gap:2px;overflow-x:auto;max-width:1400px;margin:14px auto 0;scrollbar-width:thin}
nav button{
  background:transparent;border:0;border-bottom:3px solid transparent;
  color:#93AAA0;padding:10px 16px 11px;cursor:pointer;white-space:nowrap;
  font-size:14px;border-radius:6px 6px 0 0;
}
nav button:hover{color:#E7F2EC;background:rgba(255,255,255,.05)}
nav button[aria-selected="true"]{color:#fff;border-bottom-color:var(--green);font-weight:600}
nav .cnt{color:#6F877C;font-size:12px;margin-left:6px}
nav button[aria-selected="true"] .cnt{color:#7FCBA0}

main{max-width:1400px;margin:0 auto;padding:22px 24px 80px}
.panel{display:none}
.panel.on{display:block}

h2{font-size:17px;margin:0 0 3px;font-weight:650;letter-spacing:-.01em}
.lede{color:var(--muted);font-size:13.5px;margin:0 0 18px}
section{margin-bottom:26px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}

/* ---------- medidor de cobertura ---------- */
.cover{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px}
.cover .big{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.cover .pct{font-size:56px;line-height:.9;font-weight:700;letter-spacing:-.03em}
.cover .pctlab{color:var(--muted);font-size:13.5px;padding-bottom:6px}
.track{height:22px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;margin-top:16px}
.track i{display:block;height:100%;transition:width .35s ease}
.track i.g{background:var(--green)}
.track i.m{background:var(--amber)}
.track i.p{background:var(--clay)}
.legend{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block}
.dot.g{background:var(--green)} .dot.m{background:var(--amber)} .dot.p{background:var(--clay)}

/* ---------- kpis ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi b{display:block;font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.kpi small{color:var(--muted);font-size:12.5px}

/* ---------- gráficos de barra ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
.chart h3{font-size:14px;margin:0 0 2px;font-weight:600}
.chart .hint{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.brow{display:grid;grid-template-columns:118px 1fr 62px;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
.brow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:15px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);transition:width .3s ease}
.bar i.amber{background:var(--amber)} .bar i.clay{background:var(--clay)} .bar i.ink{background:#4A6B5C}
.brow .vl{text-align:right;color:var(--muted);font-size:12.5px}
.empty{color:var(--muted);font-size:13px;padding:14px 0;font-style:italic}

/* ---------- filtros ---------- */
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters input[type=search],.filters select{
  border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:13.5px;
}
.filters input[type=search]{min-width:210px}
.filters .res{color:var(--muted);font-size:13px;margin-left:auto}

/* ---------- tabelas ---------- */
.tw{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{
  text-align:left;font-weight:600;font-size:12px;color:var(--muted);
  padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);
  position:sticky;top:0;white-space:nowrap;
}
td{padding:9px 12px;border-bottom:1px solid #EDF2EF;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.clic{cursor:pointer}
tbody tr.clic:hover{background:var(--green-soft)}
.nmcell{font-weight:600}
td.num{text-align:right;color:var(--muted)}

.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.tag.g{background:var(--green-soft);color:var(--green-dk)}
.tag.m{background:var(--amber-soft);color:#8A5A12}
.tag.p{background:var(--clay-soft);color:#8A3D29}
.tag.ok{background:var(--green);color:#fff}
.tag.no{background:#E9EEEB;color:var(--muted)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{background:var(--green-soft);color:var(--green-dk);border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:600}
.chip b{cursor:pointer;margin-left:5px;opacity:.55;font-weight:700}
.chip b:hover{opacity:1;color:var(--clay)}

/* ---------- modal ---------- */
.veil{position:fixed;inset:0;background:rgba(14,28,22,.5);display:none;z-index:60;padding:20px;overflow:auto}
.veil.on{display:block}
.modal{background:var(--surface);max-width:720px;margin:36px auto;border-radius:14px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mhead{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.mhead h3{margin:0 0 5px;font-size:19px;letter-spacing:-.01em}
.mhead .meta{color:var(--muted);font-size:13px}
.mhead .x{margin-left:auto;background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);padding:0 2px}
.mhead .x:hover{color:var(--ink)}
.mbody{padding:20px 24px 24px}
.mbody h4{font-size:13px;margin:0 0 8px;font-weight:600}
.mbody section{margin-bottom:22px}
textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:84px;resize:vertical;font-size:14px}
.btn{background:var(--green);color:#fff;border:0;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:14px;font-weight:600}
.btn:hover{background:var(--green-dk)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 12px;font-size:13px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
select.sol{border:1px solid var(--line);border-radius:8px;padding:8px 10px;flex:1;min-width:200px;background:var(--surface)}
.fu{border-left:3px solid var(--green);background:var(--surface-2);padding:10px 13px;border-radius:0 8px 8px 0;margin-bottom:9px}
.fu time{display:block;color:var(--muted);font-size:11.5px;margin-bottom:4px}
.fu p{margin:0;white-space:pre-wrap;font-size:13.5px}
.fu .del{float:right;background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px}
.fu .del:hover{color:var(--clay)}
.switch{display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px 13px;cursor:pointer}
.switch input{width:17px;height:17px;accent-color:var(--green);cursor:pointer}

/* ---------- cadastro ---------- */
.tw.edit td{padding:5px 7px}
.tw.edit input,.tw.edit select{
  width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 7px;font-size:13.5px;
}
.tw.edit input:hover,.tw.edit select:hover{border-color:var(--line)}
.tw.edit input:focus,.tw.edit select:focus{border-color:var(--green);background:var(--surface);outline:none}
.del-row{background:none;border:0;color:#B9C6BF;cursor:pointer;font-size:17px;padding:0 5px}
.del-row:hover{color:var(--clay)}
.note{background:var(--amber-soft);border:1px solid #EBD6AC;border-radius:var(--r);padding:12px 15px;font-size:13px;color:#6B4A12;margin-bottom:18px}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);
  background:var(--ink);color:#fff;padding:10px 20px;border-radius:9px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.22s;z-index:90;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:640px){
  main{padding:18px 14px 70px} header{padding:16px 14px 0}
  .cover .pct{font-size:44px} .brow{grid-template-columns:90px 1fr 48px}
  .modal{margin:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
</style>
</head>

const SEGMENTOS = ["Abastecimento de Loja","Administração, Financeiro e Comercial",
  "Capacitação e Treinamento","Comunicação e Marketing","Estrutura, Construção e Reforma",
  "Gestão de Colaboradores","Limpeza e Conservação","Logística",
  "Manutenção e Assistência Técnica","Máquinas, Equipamentos e Mobiliários",
  "Organizações e Entidades","Outros","Saúde e Bem-estar","Segurança",
  "Softwares, Sistemas e Tecnologias","Suprimentos e Embalagens",
  "Terceirização de Serviços","Turismo","Utensílios","Veículos"];

const KEY = "acaps2026.sankhya.v1";

function baseInicial(){
  return SEED.trim().split("\n").map((l,i)=>{
    const [nome,seg,porte,fat,site,exe] = l.split("|");
    return {id:"e"+i, nome, seg, porte, fat, site, exec:exe,
            visitado:false, followups:[], solucoes:[]};
  });
}

let state = carregar();

function carregar(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && Array.isArray(d.empresas) && d.empresas.length) return d;
    }
  }catch(e){}
  return {empresas: baseInicial()};
}
function salvar(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}

/* ============================================================
   HELPERS
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const byId = id => state.empresas.find(e=>e.id===id);

function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2100);
}
function porteTag(p){ return `<span class="tag ${p.toLowerCase()}">${PORTES[p]||p}</span>`; }
function statusTag(v){ return v?`<span class="tag ok">Visitado</span>`:`<span class="tag no">Pendente</span>`; }

function barras(itens, cor){
  if(!itens.length) return `<p class="empty">Nada registrado ainda.</p>`;
  const max = Math.max(...itens.map(i=>i.v), 1);
  return itens.map(i=>`
    <div class="brow">
      <span class="nm" title="${esc(i.n)}">${esc(i.n)}</span>
      <span class="bar"><i class="${cor||''}" style="width:${i.v/max*100}%"></i></span>
      <span class="vl">${i.t!==undefined?esc(i.t):i.v}</span>
    </div>`).join("");
}

/* contagem de oportunidades por solução */
function oportPorSolucao(lista){
  const m = {};
  SOLUCOES.forEach(s=>m[s]=0);
  lista.forEach(e=>e.solucoes.forEach(s=>{ if(m[s]!==undefined) m[s]++; }));
  return SOLUCOES.map(s=>({n:s,v:m[s]})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
}

   NAVEGAÇÃO
   ============================================================ */
let aba = "gestao";
const ABAS = [{id:"gestao",rot:"Visão da gestão"}]
  .concat(EXECS.map(e=>({id:"ex:"+e, rot:e})))
  .concat([{id:"cadastro",rot:"Cadastro de empresas"}]);

function renderNav(){
  $("#nav").innerHTML = ABAS.map(a=>{
    let c = "";
    if(a.id.startsWith("ex:")){
      const nome=a.id.slice(3);
      const meus=state.empresas.filter(e=>e.exec===nome);
      c=`<span class="cnt">${meus.filter(e=>e.visitado).length}/${meus.length}</span>`;
    } else if(a.id==="cadastro"){
      c=`<span class="cnt">${state.empresas.length}</span>`;
    }
    return `<button role="tab" aria-selected="${aba===a.id}" data-t="${a.id}">${esc(a.rot)}${c}</button>`;
  }).join("");
  $("#nav").querySelectorAll("button").forEach(b=>
    b.onclick=()=>{ aba=b.dataset.t; render(); window.scrollTo({top:0}); });
}

function render(){ renderNav(); renderMain(); salvar(); }

function renderMain(){
  if(aba==="gestao") $("#main").innerHTML = viewGestao();
  else if(aba==="cadastro"){ $("#main").innerHTML = viewCadastro(); ligarCadastro(); }
  else { $("#main").innerHTML = viewExec(aba.slice(3)); }
  ligarTabelas();
  ligarFiltros();
}

/* ============================================================
   ABA 1 — VISÃO DA GESTÃO
   ============================================================ */
let fG = {q:"", porte:"", exec:"", status:""};

function viewGestao(){
  const t = state.empresas;
  const vis = t.filter(e=>e.visitado);
  const cob = pct(vis.length, t.length);

  const porPorte = ["G","M","P"].map(p=>{
    const g=t.filter(e=>e.porte===p), v=g.filter(e=>e.visitado);
    return {p, tot:g.length, vis:v.length, pc:pct(v.length,g.length)};
  });

  const porExec = EXECS.map(x=>{
    const g=t.filter(e=>e.exec===x), v=g.filter(e=>e.visitado);
    return {n:x, v:pct(v.length,g.length), t:`${v.length}/${g.length}`};
  });

  const opor = oportPorSolucao(t);
  const totOpor = t.reduce((s,e)=>s+e.solucoes.length,0);
  const totFu = t.reduce((s,e)=>s+e.followups.length,0);
  const comOpor = t.filter(e=>e.solucoes.length>0).length;

  const oporExec = EXECS.map(x=>{
    const g=t.filter(e=>e.exec===x);
    return {n:x, v:g.reduce((s,e)=>s+e.solucoes.length,0)};
  }).sort((a,b)=>b.v-a.v);

  /* largura de cada fatia do medidor = participação real no total */
  const seg = porPorte.map(o=>({
    cls:o.p.toLowerCase(),
    w: t.length ? (o.vis/t.length*100) : 0
  }));

  return `
  <div class="panel on">
    <h2>Cobertura do evento</h2>
    <p class="lede">Atualiza a cada visita e follow-up registrado pelos executivos.</p>

    <section class="cover">
      <div class="big">
        <span class="pct">${cob}%</span>
        <span class="pctlab">${vis.length} de ${t.length} expositores já visitados</span>
      </div>
      <div class="track">
        ${seg.map(s=>`<i class="${s.cls}" style="width:${s.w}%"></i>`).join("")}
      </div>
      <div class="legend">
        ${porPorte.map(o=>`<span><i class="dot ${o.p.toLowerCase()}"></i>
          ${PORTES[o.p]} · ${o.vis}/${o.tot} (${o.pc}%)</span>`).join("")}
      </div>
    </section>

    <section class="kpis">
      <div class="kpi"><b>${t.length}</b><small>Expositores na carteira</small></div>
      <div class="kpi"><b>${t.length-vis.length}</b><small>Ainda pendentes</small></div>
      <div class="kpi"><b>${totFu}</b><small>Follow-ups escritos</small></div>
      <div class="kpi"><b>${totOpor}</b><small>Oportunidades por solução</small></div>
      <div class="kpi"><b>${comOpor}</b><small>Empresas com oportunidade</small></div>
      <div class="kpi"><b>${pct(comOpor,t.length)}%</b><small>Conversão em oportunidade</small></div>
    </section>

    <section class="grid2">
      <div class="card chart">
        <h3>Cobertura por executivo</h3>
        <p class="hint">Percentual da carteira individual já visitada.</p>
        ${barras(porExec)}
      </div>
      <div class="card chart">
        <h3>Oportunidades geradas por executivo</h3>
        <p class="hint">Soma das soluções apontadas em todos os clientes.</p>
        ${barras(oporExec,"ink")}
      </div>
    </section>

    <section class="card chart">
      <h3>Oportunidades por solução</h3>
      <p class="hint">Quantas empresas cada solução do portfólio alcançou no evento.</p>
      ${barras(opor,"amber")}
    </section>

    <section>
      <h2>Todos os prospects</h2>
      <p class="lede">Clique em uma linha para ver os follow-ups e as soluções registradas.</p>
      ${filtrosHTML(fG,true)}
      <div class="tw">
        <table>
          <thead><tr>
            <th>Empresa</th><th>Porte</th><th>Segmento</th><th>Faturamento médio</th>
            <th>Executivo</th><th>Status</th><th class="num">Follow-ups</th><th class="num">Soluções</th>
          </tr></thead>
          <tbody id="tbGestao">${linhasGestao()}</tbody>
        </table>
      </div>
    </section>
  </div>`;
}

function filtrar(f, lista){
  const q=f.q.trim().toLowerCase();
  return lista.filter(e=>
    (!q || e.nome.toLowerCase().includes(q) || e.seg.toLowerCase().includes(q)) &&
    (!f.porte || e.porte===f.porte) &&
    (!f.exec || e.exec===f.exec) &&
    (!f.status || (f.status==="v" ? e.visitado : !e.visitado))
  );
}

function filtrosHTML(f, comExec){
  return `<div class="filters" data-f="${comExec?'g':'x'}">
    <input type="search" data-k="q" placeholder="Buscar empresa ou segmento" value="${esc(f.q)}">
    <select data-k="porte">
      <option value="">Todos os portes</option>
      ${Object.entries(PORTES).map(([k,v])=>`<option value="${k}" ${f.porte===k?"selected":""}>${v}</option>`).join("")}
    </select>
    ${comExec?`<select data-k="exec">
      <option value="">Todos os executivos</option>
      ${EXECS_OPC.map(x=>`<option ${f.exec===x?"selected":""}>${esc(x)}</option>`).join("")}
    </select>`:""}
    <select data-k="status">
      <option value="">Visitados e pendentes</option>
      <option value="v" ${f.status==="v"?"selected":""}>Só visitados</option>
      <option value="p" ${f.status==="p"?"selected":""}>Só pendentes</option>
    </select>
    <span class="res" id="res"></span>
  </div>`;
}

function linhasGestao(){
  const l = filtrar(fG, state.empresas);
  const r = $("#res"); if(r) r.textContent = `${l.length} de ${state.empresas.length}`;
  if(!l.length) return `<tr><td colspan="8" class="empty">Nenhuma empresa com esses filtros. Limpe a busca para ver a lista completa.</td></tr>`;
  return l.map(e=>`
    <tr class="clic" data-id="${e.id}">
      <td class="nmcell">${esc(e.nome)}</td>
      <td>${porteTag(e.porte)}</td>
      <td>${esc(e.seg)}</td>
      <td>${esc(e.fat)}</td>
      <td>${esc(e.exec)}</td>
      <td>${statusTag(e.visitado)}</td>
      <td class="num">${e.followups.length}</td>
      <td class="num">${e.solucoes.length}</td>
    </tr>`).join("");
}

let fE = {};
EXECS.forEach(x=>fE[x]={q:"",porte:"",exec:"",status:""});

function viewExec(nome){
  const meus = state.empresas.filter(e=>e.exec===nome);
  const vis = meus.filter(e=>e.visitado);
  const cob = pct(vis.length, meus.length);
  const totOpor = meus.reduce((s,e)=>s+e.solucoes.length,0);
  const totFu = meus.reduce((s,e)=>s+e.followups.length,0);
  const distintas = new Set(meus.flatMap(e=>e.solucoes)).size;

  const porPorte = ["G","M","P"].map(p=>{
    const g=meus.filter(e=>e.porte===p), v=g.filter(e=>e.visitado);
    return {p, tot:g.length, vis:v.length, pc:pct(v.length,g.length)};
  });
  const seg = porPorte.map(o=>({cls:o.p.toLowerCase(), w: meus.length?(o.vis/meus.length*100):0}));

  const mediaGeral = pct(state.empresas.filter(e=>e.visitado).length, state.empresas.length);
  const opor = oportPorSolucao(meus);

  const pendentes = meus.filter(e=>!e.visitado);
  const prioridade = ["G","M","P"].map(p=>({
    n:PORTES[p], v:pendentes.filter(e=>e.porte===p).length
  })).filter(x=>x.v>0);

  return `
  <div class="panel on">
    <h2>Carteira de ${esc(nome)}</h2>
    <p class="lede">${meus.length} expositores — ${porPorte.map(o=>`${o.tot} ${PORTES[o.p].toLowerCase()}`).join(", ")}.</p>

    <section class="cover">
      <div class="big">
        <span class="pct">${cob}%</span>
        <span class="pctlab">${vis.length} de ${meus.length} visitados · média da equipe ${mediaGeral}%</span>
      </div>
      <div class="track">${seg.map(s=>`<i class="${s.cls}" style="width:${s.w}%"></i>`).join("")}</div>
      <div class="legend">
        ${porPorte.map(o=>`<span><i class="dot ${o.p.toLowerCase()}"></i>
          ${PORTES[o.p]} · ${o.vis}/${o.tot} (${o.pc}%)</span>`).join("")}
      </div>
    </section>

    <section class="kpis">
      <div class="kpi"><b>${meus.length-vis.length}</b><small>Faltam visitar</small></div>
      <div class="kpi"><b>${totFu}</b><small>Follow-ups escritos</small></div>
      <div class="kpi"><b>${totOpor}</b><small>Oportunidades apontadas</small></div>
      <div class="kpi"><b>${distintas}</b><small>Soluções diferentes usadas</small></div>
    </section>

    <section class="grid2">
      <div class="card chart">
        <h3>Minhas oportunidades por solução</h3>
        <p class="hint">Contagem de clientes por solução do portfólio.</p>
        ${barras(opor,"amber")}
      </div>
      <div class="card chart">
        <h3>Pendentes por porte</h3>
        <p class="hint">Onde ainda falta passar antes do fim do evento.</p>
        ${prioridade.length?barras(prioridade,"clay"):`<p class="empty">Carteira 100% coberta.</p>`}
      </div>
    </section>

    <section>
      <h2>Minhas empresas</h2>
      <p class="lede">Clique na empresa para marcar a visita, escrever o follow-up e adicionar as soluções.</p>
      ${filtrosHTML(fE[nome],false)}
      <div class="tw">
        <table>
          <thead><tr>
            <th>Empresa</th><th>Porte</th><th>Segmento</th><th>Faturamento médio</th>
            <th>Status</th><th>Soluções em oportunidade</th>
          </tr></thead>
          <tbody id="tbExec" data-exec="${esc(nome)}">${linhasExec(nome)}</tbody>
        </table>
      </div>
    </section>
  </div>`;
}

function linhasExec(nome){
  const meus = state.empresas.filter(e=>e.exec===nome);
  const l = filtrar(fE[nome], meus);
  const r = $("#res"); if(r) r.textContent = `${l.length} de ${meus.length}`;
  if(!l.length) return `<tr><td colspan="6" class="empty">Nenhuma empresa com esses filtros.</td></tr>`;
  return l.map(e=>`
    <tr class="clic" data-id="${e.id}">
      <td class="nmcell">${esc(e.nome)}</td>
      <td>${porteTag(e.porte)}</td>
      <td>${esc(e.seg)}</td>
      <td>${esc(e.fat)}</td>
      <td>${statusTag(e.visitado)}</td>
      <td>${e.solucoes.length
        ? `<div class="chips">${e.solucoes.map(s=>`<span class="chip">${esc(s)}</span>`).join("")}</div>`
        : `<span style="color:var(--muted)">—</span>`}</td>
    </tr>`).join("");
}

function ligarCadastro(){
  const tb = $("#tbCad"); if(!tb) return;
  tb.addEventListener("input", ev=>{
    const f = ev.target.closest("[data-c]"); if(!f) return;
    const emp = byId(ev.target.closest("tr").dataset.id); if(!emp) return;
    emp[f.dataset.c] = f.value;
    salvar(); renderNav();
  });
  tb.addEventListener("change", ev=>{
    const f = ev.target.closest("[data-c]"); if(!f) return;
    const emp = byId(ev.target.closest("tr").dataset.id); if(!emp) return;
    emp[f.dataset.c] = f.value;
    salvar(); renderNav();
    if(f.dataset.c==="porte"||f.dataset.c==="exec") toast("Alteração aplicada em todas as abas");
  });
  tb.addEventListener("click", ev=>{
    const b = ev.target.closest("[data-del]"); if(!b) return;
    const emp = byId(b.dataset.del);
    if(confirm(`Excluir ${emp.nome}? Os follow-ups registrados para esta empresa serão perdidos.`)){
      state.empresas = state.empresas.filter(x=>x.id!==emp.id);
      render(); toast("Empresa excluída");
    }
  });
  $("#addEmp").onclick = ()=>{
    state.empresas.push({
      id:"n"+Date.now(), nome:"Nova empresa", seg:SEGMENTOS[0], porte:"M",
      fat:"A definir", site:"", exec:EXECS[0], visitado:false, followups:[], solucoes:[]
    });
    render();
    const tr = $("#tbCad").lastElementChild;
    tr.scrollIntoView({block:"center"}); tr.querySelector("input").select();
  };
}

      </section>

      <section>
        <h4>Novo follow-up</h4>
        <textarea id="txtFu" placeholder="Com quem falou, o que foi levantado, próximo passo combinado..."></textarea>
        <div class="row" style="margin-top:9px">
          <button class="btn" id="addFu">Salvar follow-up</button>
        </div>
      </section>

      <section>
        <h4>Adicionar solução em oportunidade</h4>
        <div class="row">
          <select class="sol" id="selSol">
            <option value="">Escolha uma solução</option>
            ${SOLUCOES.filter(s=>!e.solucoes.includes(s)).map(s=>`<option>${esc(s)}</option>`).join("")}
          </select>
          <button class="btn" id="addSol">Adicionar</button>
        </div>
      </section>`}

      <section>
        <h4>Soluções registradas ${e.solucoes.length?`(${e.solucoes.length})`:""}</h4>
        ${e.solucoes.length
          ? `<div class="chips">${e.solucoes.map(s=>
              `<span class="chip">${esc(s)}${gestor?"":`<b data-rm="${esc(s)}" title="Remover">&times;</b>`}</span>`).join("")}</div>`
          : `<p class="empty">Nenhuma oportunidade apontada ainda.</p>`}
      </section>

      <section>
        <h4>Histórico de follow-ups ${e.followups.length?`(${e.followups.length})`:""}</h4>
        ${e.followups.length
          ? e.followups.slice().reverse().map(f=>`
              <div class="fu">
                ${gestor?"":`<button class="del" data-fu="${f.ts}">excluir</button>`}
                <time>${esc(f.quando)}</time><p>${esc(f.txt)}</p>
              </div>`).join("")
          : `<p class="empty">Sem registros. ${gestor?"O executivo ainda não lançou follow-up nesta conta.":"Escreva o primeiro acima."}</p>`}
      </section>

      <div class="row" style="justify-content:flex-end">
        <button class="btn ghost" id="fechar2">Fechar</button>
      </div>
    </div>`;

  $("#veil").classList.add("on");
  document.body.style.overflow="hidden";
  ligarModal(e, gestor);
}

function fechar(){
  $("#veil").classList.remove("on");
  document.body.style.overflow="";
  abertoId = null;
}

function ligarModal(e, gestor){
  $("#fechar").onclick = fechar;
  $("#fechar2").onclick = fechar;
  if(gestor) return;

  $("#chkVis").onchange = ev=>{
    e.visitado = ev.target.checked;
    salvar(); renderMainMantendoModal();
    toast(e.visitado?"Visita registrada":"Visita desmarcada");
  };

  $("#addFu").onclick = ()=>{
    const t = $("#txtFu").value.trim();
    if(!t){ $("#txtFu").focus(); toast("Escreva o follow-up antes de salvar"); return; }
    const d = new Date();
    e.followups.push({
      ts: Date.now(),
      quando: d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"})+" · "+
              d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}),
      txt: t
    });
    if(!e.visitado) e.visitado = true;
    salvar(); renderMainMantendoModal(); toast("Follow-up salvo");
  };

  $("#addSol").onclick = ()=>{
    const s = $("#selSol").value;
    if(!s){ toast("Escolha uma solução na lista"); return; }
    if(!e.solucoes.includes(s)) e.solucoes.push(s);
    salvar(); renderMainMantendoModal(); toast(s+" adicionada");
  };
}

/* delegação registrada uma única vez: o #modal é reaproveitado a cada abertura */
$("#modal").addEventListener("click", ev=>{
  const e = byId(abertoId); if(!e || aba==="gestao") return;
  const rm = ev.target.closest("[data-rm]");
  if(rm){
    e.solucoes = e.solucoes.filter(s=>s!==rm.dataset.rm);
    salvar(); renderMainMantendoModal(); return;
  }
  const df = ev.target.closest("[data-fu]");
  if(df){
    e.followups = e.followups.filter(f=>String(f.ts)!==df.dataset.fu);
    salvar(); renderMainMantendoModal(); toast("Follow-up excluído");
  }
});

function renderMainMantendoModal(){
  const id = abertoId;
  renderNav(); renderMain();
  if(id) abrir(id);
}

/* ============================================================
   LIGAÇÕES GERAIS
   ============================================================ */
function ligarTabelas(){
  document.querySelectorAll("#tbGestao, #tbExec").forEach(tb=>{
    tb.onclick = ev=>{
      const tr = ev.target.closest("tr[data-id]");
      if(tr) abrir(tr.dataset.id);
    };
  });
}

function contarResultados(){
  const r = $("#res"); if(!r) return;
  if(aba==="gestao"){
    r.textContent = `${filtrar(fG,state.empresas).length} de ${state.empresas.length}`;
  } else if(aba.startsWith("ex:")){
    const nome = aba.slice(3);
    const meus = state.empresas.filter(e=>e.exec===nome);
    r.textContent = `${filtrar(fE[nome],meus).length} de ${meus.length}`;
  }
}

function ligarFiltros(){
  const box = document.querySelector(".filters"); if(!box) return;
  contarResultados();
  const alvo = aba==="gestao" ? fG : fE[aba.slice(3)];
  box.querySelectorAll("[data-k]").forEach(el=>{
    const ev = el.tagName==="SELECT" ? "change" : "input";
    el.addEventListener(ev, ()=>{
      alvo[el.dataset.k] = el.value;
      if(aba==="gestao") $("#tbGestao").innerHTML = linhasGestao();
      else $("#tbExec").innerHTML = linhasExec(aba.slice(3));
      ligarTabelas();
    });
  });
}

$("#veil").addEventListener("click", ev=>{ if(ev.target.id==="veil") fechar(); });
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape" && abertoId) fechar(); });

$("#btnExport").onclick = ()=>{
  const b = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = "acaps-2026-prospeccao.json";
  a.click(); URL.revokeObjectURL(a.href);
  toast("Arquivo baixado");
};
$("#btnImport").onclick = ()=>$("#fileIn").click();
$("#fileIn").onchange = ev=>{
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.empresas) || !d.empresas.length) throw 0;
      const reg = state.empresas.reduce((s,e)=>s+e.followups.length+e.solucoes.length,0);
      if(reg && !confirm(`Esta tela já tem ${reg} registro(s) de campo. Carregar o arquivo substitui tudo pelo conteúdo dele. Continuar?`)){
        ev.target.value = ""; return;
      }
      state = d; render(); toast("Dados carregados");
    }catch(_){ toast("Arquivo inválido. Use um JSON baixado por esta página."); }
    ev.target.value = "";
  };
  r.readAsText(f);
};
render();
</script>
</body>
</html>
